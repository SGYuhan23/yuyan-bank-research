<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>银行反诈知识与培训辅助 Agent</title><link rel="stylesheet" href="/upgrade.css"><body><aside><h2>反诈研究工作台</h2><p>本地探索原型 · LIVE</p><button data-mode="case">案例研判</button><button data-mode="training">培训演练</button><button data-mode="graph_lab">交易图实验</button><a href="/legacy">原知识问答与材料生成 ↗</a><small>澳大利亚公开资料<br>不执行交易操作<br>本地操作人不代表身份认证</small></aside><main><header><h1>银行反诈知识与培训辅助 Agent</h1><p>把材料变成可追溯的核实建议。未知事实保留未知，结果由你审核。</p></header><div id="error" role="alert"></div><section id="case-panel"><form id="case-form"><label>你的任务<textarea id="query" required>对方发来转账凭证，货可以给他了吗？</textarea></label><div class="row"><label>业务角色<select id="role"><option value="unknown">尚不明确，先澄清</option><option value="卖方收款" selected>卖方收款</option><option value="企业付款">企业付款</option><option value="已付款企业">已付款企业</option></select></label><label>资料地区<select id="region"><option>Australia</option><option>China</option></select></label><label>检索策略<select id="retriever"><option>auto</option><option>bm25</option><option>semantic</option><option>hybrid</option><option>all</option></select></label></div><button>创建案件</button></form><div id="case-controls" hidden><p id="version"></p><div class="row"><button id="update">保存任务/角色修改</button><input type="file" id="upload" accept="text/plain,image/png,image/jpeg"><button id="run">执行 / 修改后继续</button></div><details><summary>比较用户提供的新旧收款资料（不是账户验证）</summary><textarea id="fields" placeholder='{"old":{"account":"A","amount":"100","currency":"AUD"},"new":{"account":"B","amount":"100","currency":"AUD"}}'></textarea><button id="save-fields">保存字段并增加版本</button></details><div id="artifacts"></div></div></section><section id="training-panel" hidden><p>本项目编写情境 · 非真实客户案例 · 待人工审核</p><select id="scenario"></select><button id="training-start">开始新演练</button><div id="dialogue"></div><form id="turn-form"><input id="utterance" placeholder="输入你向客户提出的问题或处理建议" required><button>发送</button></form><button id="assist">根据可见对话建议追问</button><button id="debrief">查看复盘</button><div id="debrief-result"></div><label>人工修订分数（0–3）<input id="manual-score" type="number" min="0" max="3" value="0"></label><button id="score-revise">记录人工评分</button></section><section id="graph-panel" hidden><p><b>SYNTHETIC 合成交易实验</b> · 无全行交易视图 · 排序分数不是欺诈概率</p><button id="graph-load">生成小型合成图并调用已训练模型</button><div id="graph-result"></div></section><section id="progress" aria-live="polite"></section><section id="result"></section><section id="review" hidden><h2>人工审核当前版本</h2><input id="operator" placeholder="本地操作者名称" value="local-reviewer"><textarea id="note" placeholder="审核依据或修改原因"></textarea><details><summary>修订建议（JSON，保留证据ID、对象与条件）</summary><textarea id="revisions"></textarea></details><button data-review="accept">确认</button><button data-review="reject">驳回</button><button data-review="revise">记录修订</button><button id="export">导出案件与审核记录</button><div id="review-status"></div></section></main><script src="/upgrade.js"></script></body></html>
