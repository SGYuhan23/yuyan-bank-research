<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>银行反诈知识与培训辅助 Agent</title><link rel="stylesheet" href="style.css"></head><body><header><b>反诈知识与培训辅助 Agent</b><span>澳大利亚公开资料 · 本地验证版</span></header><main><p class="eyebrow">有依据地解答，有边界地培训</p><h1>这次需要什么帮助？</h1><div class="tasks"><button class="active" data-task="knowledge">查询反诈知识<span>核实步骤、适用边界与来源</span></button><button data-task="training">生成培训材料<span>情境、线索、追问与参考思路</span></button></div><form id="form"><label for="query">问题或培训要求</label><textarea id="query">熟悉的供应商发邮件说更换收款账户，应该核实什么？</textarea><div class="row"><small>使用已核校官方资料检索；不判断具体交易安全，不执行账户操作。</small><button id="start">开始查询 →</button></div></form><p id="error" role="alert"></p><section id="progress" aria-live="polite"></section><article id="result"></article><footer>公开安全指引不等于 Westpac 内部操作规程。培训情境为项目编写，默认待人工审核，未用于银行业务。</footer></main><script src="app.js"></script></body></html>
