name: yuqi-agent-platform
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored environment file}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - agent-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_platform']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  agent-data:
