name: Publish industry research showcase
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'research-showcase/**'
      - 'PUBLIC_RELEASE_INVENTORY.json'
      - 'scripts/export_static_demo_data.py'
      - 'agent-ops/examples/fuling.py'
      - 'agent-ops/research/**'
      - 'agent-ops/test_*.py'
      - 'agent-platform/frontend/public/research/**'
      - 'docs/screenshots/**'
      - 'docs/reports/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Verify committed release snapshot
        run: python scripts/portfolio_verify.py
      - name: Verify current research delivery
        working-directory: research-showcase
        run: |
          python -m unittest test_model -v
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run test:deploy
          python verify_delivery.py
          git diff --exit-code -- dist
      - name: Rebuild data from Python source
        run: |
          python -S agent-ops/research/build_data.py
          python -S scripts/export_static_demo_data.py
      - name: Python regression
        run: |
          python -m pip install -r agent-ops/research/review-requirements.txt
          python -m pytest agent-ops/test_fuling_v2.py agent-ops/test_supplier_ledger.py agent-ops/test_research_models.py agent-ops/test_v2_evidence.py agent-ops/test_scenario_semantics.py agent-ops/test_public_release.py -q
      - name: Browser engine parity against dynamic Python results
        run: node --test site/tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Build guided React site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: research-showcase/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
