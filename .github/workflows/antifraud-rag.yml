name: Validate antifraud RAG
on:
  push:
    branches: ['codex/antifraud-rag', 'codex/antifraud-tools-upgrade']
    paths: ['antifraud-rag/**', '.github/workflows/antifraud-rag.yml']
  pull_request:
    paths: ['antifraud-rag/**', '.github/workflows/antifraud-rag.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r antifraud-rag/requirements-upgrade.txt
      - run: python -m unittest discover -s antifraud-rag -p 'test_*.py' -v
      - run: python -m compileall -q antifraud-rag
      - run: node --check antifraud-rag/web/app.js
      - run: node --check antifraud-rag/web/upgrade.js
