<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="渝研银行经营分析 Agent：浏览器内确认参数、计算客户经营资源与供应商现金流，无需登录。"><title>渝研｜银行经营分析</title><link rel="stylesheet" href="style.css"></head><body>
<button id="reset" hidden aria-hidden="true" tabindex="-1">重置演示</button>
<div class="workspace"><header><div><strong>渝研｜银行经营分析</strong><span>Agent Demo</span></div><a href="project.html">项目介绍</a><a href="https://github.com/SGYuhan23/yuyan-bank-research">GitHub ↗</a><button id="mobile-reset">重置演示</button></header>
<main id="chat" aria-label="分析对话"><div class="welcome"><span class="logo">渝</span><h1>你好，欢迎回来！</h1><p>描述客户经营或供应商资金问题，让渝研帮你分析。<br>你可以确认参数、查看计算过程，并继续调整。</p><div class="suggestions" id="suggestions"></div><p class="mode-note">参数识别：浏览器规则 · 计算：浏览器实时执行<br><a href="#" id="replay-entry">也可以看一次已有模型调用回放</a>，这里不会实时调用模型。</p></div></main>
<div class="composer-wrap"><form id="composer"><label class="sr-only" for="question">输入问题</label><textarea id="question" placeholder="输入问题，例如：C1 回款延期 14 天会怎样？" rows="2" maxlength="1000"></textarea><div class="composer-footer"><span>客户经营 · 企业资金</span><button id="send" type="submit" aria-label="发送 ↑">发送 ↑</button></div></form><p class="footnote">客户与订单均为合成数据，输出不代表实际经营业绩。<span id="storage-note"></span></p></div></div><script type="module" src="app.js"></script></body></html>
