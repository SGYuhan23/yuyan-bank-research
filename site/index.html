<main id="chat" aria-label="分析对话"><div class="welcome"><span class="logo">渝</span><h1>银行经营分析 Agent</h1><p>你好，我可以帮你分析客户经营和供应商资金问题。<br>先确认你的问题，再一起看计算结果。</p><div class="suggestions" id="suggestions"></div><p class="mode-note">参数识别：浏览器规则 · 计算：浏览器实时执行<br><a href="#" id="replay-entry">也可以看一次已有模型调用回放</a>，这里不会实时调用模型。</p></div></main>
<div class="composer-wrap"><form id="composer"><label class="sr-only" for="question">输入问题</label><textarea id="question" placeholder="输入问题，例如：C1 回款延期 14 天会怎样？" rows="2" maxlength="1000"></textarea><div class="composer-footer"><span>客户经营 · 企业资金</span><button id="send" type="submit">发送 ↑</button></div></form><p class="footnote">客户与订单均为合成数据，输出不代表实际经营业绩。<span id="storage-note"></span></p></div></div><script type="module" src="app.js"></script></body></html>
