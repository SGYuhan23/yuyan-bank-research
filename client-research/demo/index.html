<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渝研 · 研究工作台</title><link rel="stylesheet" href="style.css"></head><body><aside class="sidebar"><a class="brand" href="./">渝研 <span>重庆产业客户研究 Agent</span></a><button id="new-chat">＋ 新研究</button><p class="nav-label">选择研究任务</p><nav id="choices"></nav><div class="sidebar-bottom">面向对公客户经理的访前研究<br><a href="https://github.com/SGYuhan23/yuyan-bank-research/tree/codex/chongqing-client-research/client-research">项目源码与真实评测 ↗</a></div></aside><div class="workspace"><header><span id="chat-title">新研究</span><button id="header-new" type="button">＋ 新研究</button><select id="execution" aria-label="执行模式"><option value="replay">历史真实运行回放</option><option value="live" disabled>本地实时 Agent · 正在检测</option></select></header><main><section id="welcome"><div class="spark">研</div><h1>今天，准备拜访哪家企业？</h1><p>给我一个研究问题。我会查资料、核对变化，<br>把证据和需要当面确认的问题一起交给你。</p><div id="suggestions"></div></section><section id="conversation" aria-live="polite"></section><article id="report" hidden></article></main><div class="composer-wrap"><div id="task-brief"></div><form id="research-chat"><label for="prompt">研究任务 / 完整 Prompt</label><textarea id="prompt" rows="4" placeholder="先选择一个研究任务，或切换本地实时 Agent 后编辑问题。"></textarea><div class="composer-actions"><span id="mode-note">回放已有真实工具记录，不执行新问题。</span><div><button type="button" id="stop" hidden>暂停回放</button><button id="send" disabled>开始研究回放 ↑</button></div></div></form><p id="message" role="status"></p></div></div><aside class="evidence-drawer"><h3>本次研究资料 <span id="source-count">0</span></h3><p class="muted">资料会随着读取步骤出现。</p><div id="source-list"></div><details><summary>这五个任务有什么不同？</summary><p>日发：核实项目阶段。<br>秦安：区分年度与半年趋势。<br>秦安铸造：厘清母子公司口径。<br>隆鑫：用反证检验汇率服务假设。<br>紫硕：资料不足时停止推断。</p></details></aside><script src="app.js"></script><script src="workflow.js"></script></body></html>
